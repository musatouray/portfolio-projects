  # Core dimension models for customers, sellers, products, and dates. 
  # Fact models for orders and order items. These are the foundational tables that capture transactions in the e-commerce retail ecosystem.
  # These tables are designed to be the foundation for all downstream marts and analyses, 
  # providing a single source of truth for key entities and their attributes. 
  # They include comprehensive data quality tests to ensure reliability and consistency across the analytics ecosystem.

version: 2

models:
  # Customers dimension model
  - name: dim_customers
    description: >
      Pure customer dimension table containing customer attributes, location, and cohort assignment.
      Grain is one row per unique customer (customer_unique_id). Includes customers who have
      never placed an order (prospects). Transactional metrics (orders, revenue, segments) are
      calculated in downstream fact tables. Excludes canceled/unavailable orders from cohort assignment.
    columns:
      - name: customer_key
        description: Surrogate key for the customer dimension, generated from customer_unique_id
        data_tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: Natural key - unique customer identifier from source system
        data_tests:
          - unique
          - not_null

      - name: zip_code
        description: Customer's zip code (5-digit, zero-padded). Uses most recent address if customer has multiple orders.

      - name: city
        description: Customer's city name (title case). Uses most recent address if customer has multiple orders.

      - name: state
        description: Customer's state code (2-letter uppercase). Uses most recent address if customer has multiple orders.

      - name: first_order_date
        description: Date of the customer's first order (excluding canceled/unavailable). NULL for prospects.

      - name: cohort_month
        description: >
          Month when the customer made their first purchase (DATE_TRUNC of first_order_date).
          NULL for prospects. Used for cohort analysis without requiring FK joins.

      - name: created_at
        description: Timestamp when this record was created in the data warehouse
        data_tests:
          - not_null

      - name: updated_at
        description: Timestamp when this record was last updated in the data warehouse
        data_tests:
          - not_null

  # Sellers dimension model
  - name: dim_sellers
    description: >
      Pure seller dimension table containing seller attributes and location only.
      Grain is one row per seller (seller_id). Includes all sellers.
      Transactional metrics (orders, revenue, delivery performance) belong in fact tables.
    columns:
      - name: seller_key
        description: Surrogate key for the seller dimension, generated from seller_id
        data_tests:
          - unique
          - not_null

      - name: seller_id
        description: Natural key - unique seller identifier from source system
        data_tests:
          - unique
          - not_null

      - name: zip_code
        description: Seller's zip code (5-digit, zero-padded)

      - name: city
        description: Seller's city name (title case)

      - name: state
        description: Seller's state code (2-letter uppercase)

      - name: latitude
        description: Geographic latitude of seller location (deterministic geo deduplication)

      - name: longitude
        description: Geographic longitude of seller location (deterministic geo deduplication)

      - name: primary_product_category
        description: >
          The product category (English) with the most items sold by this seller.
          Ties broken by most recent order date, then alphabetically.
          'Unknown' if no category data available.
        data_tests:
          - not_null

      - name: created_at
        description: Timestamp when this record was created in the data warehouse
        data_tests:
          - not_null

      - name: updated_at
        description: Timestamp when this record was last updated in the data warehouse
        data_tests:
          - not_null

  # Products dimension model
  - name: dim_products
    description: >
      Pure product dimension table containing product attributes only.
      Grain is one row per product (product_id). Includes all products.
      Transactional metrics (sales, reviews, performance) belong in fact tables.
    columns:
      - name: product_key
        description: Surrogate key for the product dimension, generated from product_id
        data_tests:
          - unique
          - not_null

      - name: product_id
        description: Natural key - unique product identifier from source system
        data_tests:
          - unique
          - not_null

      - name: product_name
        description: Descriptive product name for display in reports and analytics
        data_tests:
          - not_null

      - name: product_category
        description: Product category name in English (translated from Portuguese)

      - name: name_length
        description: Length of product name in characters

      - name: description_length
        description: Length of product description in characters

      - name: photos_qty
        description: Number of product photos

      - name: weight_g
        description: Product weight in grams

      - name: length_cm
        description: Product length in centimeters

      - name: height_cm
        description: Product height in centimeters

      - name: width_cm
        description: Product width in centimeters

      - name: created_at
        description: Timestamp when this record was created in the data warehouse
        data_tests:
          - not_null

      - name: updated_at
        description: Timestamp when this record was last updated in the data warehouse
        data_tests:
          - not_null

  # Dates dimension model
  - name: dim_dates
    description: >
      Date dimension table with pre-generated date range (2016-2028).
      Contains date attributes for time-based analysis including ISO week numbering,
      period start dates, and weekend flags. Independent of transactional data.
    columns:
      - name: date_key
        description: Integer surrogate key in YYYYMMDD format (e.g., 20231225 for Dec 25, 2023)
        data_tests:
          - unique
          - not_null

      - name: date
        description: Calendar date (natural key)
        data_tests:
          - unique
          - not_null

      - name: year
        description: Calendar year (e.g., 2023)

      - name: iso_year
        description: ISO year for week-based calculations

      - name: iso_year_week
        description: ISO year and week in format YYYY-WNN (e.g., 2023-W52)

      - name: year_quarter
        description: Year and quarter in format YYYY-QN (e.g., 2023-Q4)

      - name: year_start_date
        description: First day of the year

      - name: year_month
        description: Year and month in format YYYY-MM (e.g., 2023-12)

      - name: quarter_number
        description: Quarter number (1-4)

      - name: quarter_name
        description: Quarter name (Q1, Q2, Q3, Q4)

      - name: quarter_start_date
        description: First day of the quarter

      - name: month
        description: Month number (1-12)

      - name: month_name
        description: Full month name (January, February, etc.)

      - name: month_year
        description: Month and year in format Mon-YYYY (e.g., Dec-2023)

      - name: month_start_date
        description: First day of the month

      - name: week
        description: Week number of the year

      - name: year_week
        description: Week and year in format WW-YYYY

      - name: week_start_date
        description: First day of the week (Monday)

      - name: day
        description: Day of the month (1-31)

      - name: iso_day_of_week
        description: ISO day of week (1=Monday, 7=Sunday)

      - name: day_name
        description: Abbreviated day name (Mon, Tue, etc.)

      - name: day_of_week
        description: Snowflake day of week (0=Sunday, 6=Saturday)

      - name: is_weekend
        description: TRUE if Saturday or Sunday

      - name: is_iso_weekend
        description: TRUE if Saturday or Sunday (ISO convention)

      - name: month_initial
        description: First letter of month name with zero-width spaces for Power BI sorting

      - name: created_at
        description: Timestamp when this record was created
        data_tests:
          - not_null

      - name: updated_at
        description: Timestamp when this record was last updated
        data_tests:
          - not_null

  # Orders fact table
  - name: fct_orders
    description: >
      Fact table for orders at order grain (one row per order).
      Use this for order-level analytics: revenue trends, AOV, customer behavior.
      Includes role-playing date dimensions for multiple date contexts.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_price >= 0 or total_price IS NULL"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_freight_value >= 0 or total_freight_value IS NULL"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_payment_value >= 0 or total_payment_value IS NULL"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "review_score between 1 and 5 or review_score IS NULL"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "approval_date_key IS NULL or approval_date_key >= order_date_key"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "delivery_date_key IS NULL or delivery_date_key >= order_date_key"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "estimated_delivery_date_key IS NULL or estimated_delivery_date_key >= order_date_key"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "delivery_date_key IS NULL or approval_date_key IS NULL or delivery_date_key >= approval_date_key"
          config:
            severity: warn  # Some orders may have delivery before approval due to data issues, so we warn instead of failing
            warn_if: ">= 1"  # Warn if any orders violate this condition
            error_if: ">= 50"  # Fail if 50 or more orders violate this condition, indicating a systemic data issue
      - dbt_utils.expression_is_true:
          arguments:
            expression: "gross_order_value = total_price + total_freight_value"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "delivery_days IS NULL or delivery_days >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "fulfillment_days IS NULL or fulfillment_days >= 0"
          config:
            severity: warn
            warn_if: ">= 1"
            error_if: ">= 50"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "shipping_transit_days IS NULL or shipping_transit_days >= 0"
          config:
            severity: warn
            warn_if: ">= 1"
            error_if: ">= 50"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "payment_count IS NULL or payment_count >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "review_count IS NULL or review_count >= 0"
    columns:
      - name: order_key
        description: Surrogate key for the order fact, generated from order_id
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: Natural key - unique order identifier from source system
        data_tests:
          - unique
          - not_null

      - name: customer_key
        description: Surrogate key matching dim_customers (deterministically generated, no join required)
        data_tests:
          - not_null

      - name: customer_unique_id
        description: Natural key - unique customer identifier from source system
        data_tests:
          - not_null

      - name: order_date_key
        description: Foreign key to dim_dates for order placement date
        data_tests:
          - not_null

      - name: approval_date_key
        description: Foreign key to dim_dates for order approval date

      - name: delivery_date_key
        description: Foreign key to dim_dates for customer delivery date

      - name: estimated_delivery_date_key
        description: Foreign key to dim_dates for estimated delivery date

      - name: order_status
        description: Current status of the order
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["approved", "canceled", "delivered", "invoiced", "processing", "shipped", "unavailable"]

      - name: delivery_days
        description: Days from order placement to customer delivery. NULL if not delivered.

      - name: fulfillment_days
        description: Days from order approval to customer delivery. NULL if not delivered.

      - name: shipping_transit_days
        description: Days from carrier pickup to customer delivery. NULL if not delivered.

      - name: is_on_time_delivery
        description: TRUE if delivered on or before estimated date, FALSE otherwise, NULL if not delivered.

      - name: total_price
        description: Total item price for the order (BRL)
        data_tests:
          - not_null

      - name: total_freight_value
        description: Total freight/shipping cost for the order (BRL)
        data_tests:
          - not_null

      - name: gross_order_value
        description: Total order value including freight (total_price + total_freight_value)
        data_tests:
          - not_null

      - name: payment_count
        description: Number of payment installments for the order

      - name: total_payment_value
        description: Total payment amount collected for the order (BRL)

      - name: review_count
        description: Number of reviews submitted for this order

      - name: review_score
        description: Average review score for this order (1-5 scale)

      - name: created_at
        description: Timestamp when this record was created in the data warehouse
        data_tests:
          - not_null

      - name: updated_at
        description: Timestamp when this record was last updated in the data warehouse
        data_tests:
          - not_null

  # Order items fact table
  - name: fct_order_items
    description: >
      Fact table for order items at line-item grain (one row per order item).
      Use this for product/seller analytics: category performance, seller metrics, basket analysis.
      Includes role-playing date dimensions for date contexts.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
    columns:
      - name: order_item_key
        description: Surrogate key for the order item fact, generated from (order_id, order_item_id)
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: Order identifier from source system
        data_tests:
          - not_null

      - name: order_item_id
        description: Sequential item number within the order
        data_tests:
          - not_null

      - name: product_id
        description: Natural key - product identifier from source system
        data_tests:
          - not_null

      - name: seller_id
        description: Natural key - seller identifier from source system
        data_tests:
          - not_null

      - name: customer_key
        description: Surrogate key matching dim_customers (deterministically generated, no join required)
        data_tests:
          - not_null

      - name: product_key
        description: Surrogate key matching dim_products (deterministically generated, no join required)
        data_tests:
          - not_null

      - name: seller_key
        description: Surrogate key matching dim_sellers (deterministically generated, no join required)
        data_tests:
          - not_null

      - name: order_date_key
        description: Foreign key to dim_dates for order placement date
        data_tests:
          - not_null

      - name: delivery_date_key
        description: Foreign key to dim_dates for customer delivery date

      - name: order_date
        description: Date when the order was placed
        data_tests:
          - not_null

      - name: order_status
        description: Current status of the order
        data_tests:
          - not_null

      - name: item_price
        description: Price of this item (BRL)
        data_tests:
          - not_null

      - name: item_freight
        description: Freight cost allocated to this item (BRL)
        data_tests:
          - not_null

      - name: item_total
        description: Total value for this item (item_price + item_freight)
        data_tests:
          - not_null

      - name: created_at
        description: Timestamp when this record was created in the data warehouse
        data_tests:
          - not_null

      - name: updated_at
        description: Timestamp when this record was last updated in the data warehouse
        data_tests:
          - not_null

