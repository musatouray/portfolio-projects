[project]
name = "advanced-sql-patterns"
version = "0.1.0"
description = "Advanced T-SQL patterns for business analytics with Jupyter notebook visualizations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyodbc>=4.0.39",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.0.0",
]
