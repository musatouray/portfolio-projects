# Customer analytics models for segmentation, retention, and lifetime value analysis.
# These models power marketing campaigns, churn prevention, and customer insights.

version: 2

models:
  # Consolidated RFM and Churn Risk model with monthly snapshots.
  - name: fct_rfm_segments
    description: >
      Consolidated RFM and churn risk fact table with monthly snapshots. Combines RFM scoring
      with churn risk metrics for unified customer health analysis. Each row represents a
      customer's state at a given month, enabling segment migration and churn trend analysis.
      Self-contained model calculating all metrics from orders. Excludes canceled/unavailable orders.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - snapshot_month
              - customer_unique_id
      - dbt_utils.expression_is_true:
          arguments:
            expression: "churn_risk_score >= 0 AND churn_risk_score <= 100"
    columns:
      - name: rfm_snapshot_key
        description: Surrogate key for the RFM snapshot record (snapshot_month + customer)
        data_tests:
          - unique
          - not_null

      - name: customer_key
        description: Foreign key to dim_customers for star schema joins
        data_tests:
          - not_null

      - name: snapshot_date_key
        description: Integer surrogate key in YYYYMMDD format (e.g., 20231201) for joining to dim_dates
        data_tests:
          - not_null

      - name: snapshot_month
        description: Month for which the scores are calculated (end of month reference)
        data_tests:
          - not_null

      - name: customer_unique_id
        description: Unique customer identifier
        data_tests:
          - not_null

      - name: recency_days
        description: Days since customer's last purchase as of snapshot month end (lower = better)
        data_tests:
          - not_null

      - name: total_orders
        description: Total number of orders placed by the customer through snapshot month
        data_tests:
          - not_null

      - name: total_revenue
        description: Total revenue generated by the customer through snapshot month (BRL)
        data_tests:
          - not_null

      - name: average_rating
        description: Weighted average review score (1-5 scale) through snapshot month. NULL if no reviews.

      - name: r_score
        description: Recency score from 1-5 (5 = most recent), calculated within snapshot month
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: f_score
        description: Frequency score from 1-5 (5 = most frequent), calculated within snapshot month
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: m_score
        description: Monetary score from 1-5 (5 = highest spend), calculated within snapshot month
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: churn_status
        description: >
          Customer churn status at snapshot time based on recency thresholds:
          Active, Cooling, At Risk, Churned.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Active
                  - Cooling
                  - At Risk
                  - Churned

      - name: customer_nps_segment
        description: >
          Customer satisfaction segment based on average rating at snapshot time:
          promoter, neutral, detractor, unknown.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - promoter
                  - neutral
                  - detractor
                  - unknown

      - name: churn_risk_score
        description: >
          Composite churn risk score (0-100, higher = more at risk). Factors: dormancy (0-40),
          single purchaser (+25), satisfaction (-20 detractor, +10 unknown), low value (+15).
        data_tests:
          - not_null

      - name: churn_risk_segment
        description: Risk segment based on composite churn_risk_score thresholds.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Critical
                  - High
                  - Medium
                  - Low

      - name: rfm_segment
        description: Business segment classification based on RFM scores
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Champions
                  - Loyalists
                  - New Customers
                  - At Risk / Hibernating
                  - General Pool

      - name: created_at
        description: Timestamp when the record was created
        data_tests:
          - not_null

      - name: updated_at
        description: Timestamp when the record was last updated
        data_tests:
          - not_null

  # Cohort retention model tracking customer retention by acquisition month and period.
  - name: fct_cohort_retention
    description: >
      Self-contained cohort retention fact table tracking customer retention by acquisition month.
      Each row represents a cohort-period combination showing how many customers
      from each acquisition cohort were active in subsequent months.
      Includes period-level revenue, orders, and enterprise retention metrics (gross/net retained revenue).
      Excludes canceled/unavailable orders and partial current month data.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - cohort_month
              - period
    columns:
      - name: cohort_retention_key
        description: Surrogate key for the cohort retention record
        data_tests:
          - unique
          - not_null

      - name: cohort_month
        description: Month when customers in this cohort made their first purchase
        data_tests:
          - not_null

      - name: cohort_size
        description: Total customers in this cohort (used for retention % calculation)
        data_tests:
          - not_null

      - name: period
        description: Number of months since cohort formation (0 = first month)
        data_tests:
          - not_null

      - name: active_customers
        description: Count of customers from this cohort who placed an order in this period
        data_tests:
          - not_null

      - name: period_orders
        description: Total orders placed by this cohort in this period
        data_tests:
          - not_null

      - name: period_revenue
        description: Total revenue (payment value) from this cohort in this period (BRL)
        data_tests:
          - not_null

      - name: gross_retained_revenue
        description: >
          Gross Revenue Retention (GRR) numerator - capped at initial revenue.
          Cannot exceed cohort_initial_revenue (100% max). Use for GRR% calculation.
        data_tests:
          - not_null

      - name: net_retained_revenue
        description: >
          Net Revenue Retention (NRR) numerator - includes expansion revenue.
          Can exceed cohort_initial_revenue (>100% possible). Use for NRR% calculation.
        data_tests:
          - not_null

      - name: cohort_initial_revenue
        description: >
          Total revenue generated by this cohort in period 0 (their first month).
          Denominator for GRR% and NRR% calculations.
        data_tests:
          - not_null

      - name: created_at
        description: Timestamp when the record was created
        data_tests:
          - not_null

      - name: updated_at
        description: Timestamp when the record was last updated
        data_tests:
          - not_null

  # CLV model with historical metrics and 12-month projection
  - name: fct_clv_customer
    description: >
      Customer Lifetime Value fact table with historical metrics and 12-month revenue projection.
      Self-contained model calculating all metrics from orders. Includes absorbed behavioral
      segments from dim_customers (lifecycle, value, satisfaction). Excludes canceled/unavailable orders.
      Use this for customer valuation, segmentation, and identifying high-value customers.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "predicted_clv_12m >= 0"
          name: fct_clv_customer_predicted_clv_non_negative
    columns:
      - name: customer_key
        description: Surrogate key matching dim_customers for star schema joins
        data_tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: Unique customer identifier (grain of the table)
        data_tests:
          - unique
          - not_null

      - name: cohort_month
        description: Month of customer's first purchase (acquisition cohort)
        data_tests:
          - not_null

      - name: first_order_date
        description: Date of customer's first order
        data_tests:
          - not_null

      - name: last_order_date
        description: Date of customer's most recent order
        data_tests:
          - not_null

      - name: total_lifetime_orders
        description: Total number of orders placed by the customer
        data_tests:
          - not_null

      - name: total_lifetime_revenue
        description: Total revenue the customer has generated to date (BRL)
        data_tests:
          - not_null

      - name: historical_aov
        description: Historical average order value (total_lifetime_revenue / total_lifetime_orders)

      - name: customer_lifespan_days
        description: Days between first and last order (0 for single-order customers)
        data_tests:
          - not_null

      - name: total_reviews
        description: Total number of reviews submitted by the customer
        data_tests:
          - not_null

      - name: average_rating
        description: Weighted average review score (1-5 scale). NULL if no reviews.

      - name: customer_lifecycle_segment
        description: >
          Customer purchase behavior segment (absorbed from dim_customers):
          new (1 order) or returning (2+ orders)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - new
                  - returning

      - name: customer_value_segment
        description: >
          Customer value segment based on total revenue (absorbed from dim_customers).
          Thresholds configurable via dbt vars.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - high_value
                  - medium_value
                  - low_value

      - name: customer_satisfaction_segment
        description: >
          Customer satisfaction segment based on average rating (absorbed from dim_customers).
          Thresholds configurable via dbt vars.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - promoter
                  - neutral
                  - detractor
                  - unknown

      - name: predicted_clv_12m
        description: >
          12-month CLV projection based on daily revenue rate extrapolated to 365 days.
          For same-day customers, uses total_lifetime_revenue as projection.
        data_tests:
          - not_null

      - name: created_at
        description: Timestamp when the record was created
        data_tests:
          - not_null

      - name: updated_at
        description: Timestamp when the record was last updated
        data_tests:
          - not_null

seeds:
  - name: rfm_segment_definitions
    description: >
      Reference table defining RFM segments with descriptions and recommended actions.
      Join to fct_rfm_segments for Power BI tooltips and segment explanations.
    columns:
      - name: rfm_segment
        description: Segment name matching fct_rfm_segments.rfm_segment
        data_tests:
          - unique
          - not_null

      - name: segment_description
        description: Human-readable description of the segment

      - name: recommended_action
        description: Suggested marketing action for this segment

      - name: priority
        description: Action priority (1 = highest)
