# Finance fact models for payment analytics.
# These tables provide transactional views for financial reporting and analysis.

version: 2

models:
  # Order payments fact table at line-item grain
  - name: fct_order_payments
    description: >
      Order payments fact table at payment line item grain.
      Use this for payment analysis, installment patterns, and payment method performance.
      Excludes canceled/unavailable orders. One row per payment transaction per order.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_sequential
              - payment_type
    columns:
      - name: order_payment_key
        description: Surrogate key for the order payment fact (hash of order_id, payment_sequential, payment_type)
        data_tests:
          - unique
          - not_null

      - name: order_key
        description: Surrogate key matching fct_orders (deterministically generated)
        data_tests:
          - not_null

      - name: customer_key
        description: Surrogate key matching dim_customers (deterministically generated)
        data_tests:
          - not_null

      - name: order_date_key
        description: Foreign key to dim_dates for order placement date
        data_tests:
          - not_null

      - name: order_id
        description: Natural key - order identifier from source system
        data_tests:
          - not_null

      - name: payment_type
        description: Payment method (credit_card, boleto, voucher, debit_card, not_defined)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - credit_card
                  - boleto
                  - voucher
                  - debit_card
                  - not_defined

      - name: payment_sequential
        description: Sequential number of the payment within the order
        data_tests:
          - not_null

      - name: payment_installments
        description: Number of installments for this payment
        data_tests:
          - not_null

      - name: payment_value
        description: Value of this payment (BRL)
        data_tests:
          - not_null

      - name: created_at
        description: Timestamp when this record was created in the data warehouse
        data_tests:
          - not_null

      - name: updated_at
        description: Timestamp when this record was last updated in the data warehouse
        data_tests:
          - not_null

