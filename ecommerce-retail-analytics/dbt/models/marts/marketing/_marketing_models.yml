# Marketing fact models for basket analysis.
# These tables provide insights for cross-selling and product recommendations.

version: 2

models:
  # Market basket analysis fact table
  - name: fct_market_basket
    description: >
      Market basket analysis fact table with atomic counts for product pair co-occurrence.
      Provides raw counts for semantic layer calculations (support, confidence, lift).
      Excludes canceled/unavailable orders. One row per product pair.
    columns:
      - name: basket_pair_key
        description: Surrogate key for the product pair (hash of product_id_a and product_id_b)
        data_tests:
          - unique
          - not_null

      - name: product_key_a
        description: Surrogate key matching dim_products for product A (deterministically generated)
        data_tests:
          - not_null

      - name: product_key_b
        description: Surrogate key matching dim_products for product B (deterministically generated)
        data_tests:
          - not_null

      - name: pair_count
        description: Number of orders containing both products
        data_tests:
          - not_null

      - name: product_a_order_count
        description: Total orders containing product A (for confidence/lift calculations)
        data_tests:
          - not_null

      - name: product_b_order_count
        description: Total orders containing product B (for confidence/lift calculations)
        data_tests:
          - not_null

      - name: created_at
        description: Timestamp when this record was created
        data_tests:
          - not_null

      - name: updated_at
        description: Timestamp when this record was last updated
        data_tests:
          - not_null
