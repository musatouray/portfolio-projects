name: 'ecommerce_retail_analytics'
version: '1.0.0'

profile: 'ecommerce_retail_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  active_days_threshold: 180
  
  # Customer segmentation thresholds
  customer_high_value_threshold: 500
  customer_medium_value_threshold: 100
  customer_promoter_threshold: 4.5
  customer_neutral_threshold: 3.0

  # Churn status thresholds (days since last order)                                                                                                                                                                                       
  # - Average purchase cycle for general retail: 30-45 days                                                                                 
  # - Customer considered "cooling" after 1-2 cycles without purchase                                                                       
  # - Customer considered "at risk" after 2-3 cycles                                                                                        
  # - Customer considered "churned" after 3+ cycles (90+ days)                                                                                                                                                                                      
  churn_churned_days: 90                                                                                                                    
  churn_at_risk_days: 60                                                                                                                    
  churn_cooling_days: 30                                                                                                                    
                                                                                                                                              
  # Low-value customer threshold for churn risk scoring
  churn_low_value_threshold: 100

  # CLV prediction model parameters
  # Prediction horizon: How far into the future to predict customer value
  # Model uses exponential decay: P(purchase) = e^(-λt)
  # where λ = purchase_rate (purchases/day), t = days_since_last_order
  clv_prediction_horizon_days: 365

  # Seller/Product segmentation thresholds
  platinum_value_threshold: 10000
  gold_value_threshold: 1000
  silver_value_threshold: 100

  # Market basket analysis thresholds
  market_basket_min_pair_count: 5

  # RFM Scoring Thresholds (absolute values, not percentiles)
  # Recency: Days since last purchase (lower is better)
  rfm_recency_score_5: 30    # 0-30 days = score 5 (most recent)
  rfm_recency_score_4: 60    # 31-60 days = score 4
  rfm_recency_score_3: 90    # 61-90 days = score 3
  rfm_recency_score_2: 180   # 91-180 days = score 2
  # 180+ days = score 1 (least recent)

  # Frequency: Total order count (higher is better)
  rfm_frequency_score_5: 5   # 5+ orders = score 5 (most frequent)
  rfm_frequency_score_4: 4   # 4 orders = score 4
  rfm_frequency_score_3: 3   # 3 orders = score 3
  rfm_frequency_score_2: 2   # 2 orders = score 2
  # 1 order = score 1 (least frequent)

  # Monetary: Total revenue (higher is better)
  rfm_monetary_score_5: 500  # $500+ = score 5 (highest value)
  rfm_monetary_score_4: 300  # $300-499 = score 4
  rfm_monetary_score_3: 150  # $150-299 = score 3
  rfm_monetary_score_2: 75   # $75-149 = score 2
  # <$75 = score 1 (lowest value)

models:
  ecommerce_retail_analytics:
    # MEDALLION ARCHITECTURE:
    # - Staging (Silver) always goes to DEV database (shared across environments)
    # - Intermediate + Marts (Gold) go to target database (DEV or PROD)
    staging:
      +database: ECOMMERCE_RETAIL_DB_DEV  # Silver layer always in DEV
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
